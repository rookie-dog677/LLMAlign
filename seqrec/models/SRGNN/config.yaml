loss_type: ce
optimizer: adam

hidden_size: 128
n_gnn_steps: 1
dropout: 0.3

train_batch_size: 100
eval_batch_size: 100
lr: 1.0e-3
weight_decay: 1.0e-5
lr_scheduler_type: step
lr_dc: 0.1
lr_dc_step: 3
epochs: 1000
eval_interval: 5
patience: 20
torch_compile_mode: default

adapter_dims: [-1]  # must ending with -1, which refers to hidden_size
item_adapter_type: linear  # linear | moe
moe_n_exps: 8
moe_dropout: 0.0
moe_noise: False
moe_top_k: 2
moe_temperature: 1.0
moe_balance_weight: 1.0e-3
